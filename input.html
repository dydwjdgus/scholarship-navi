<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>성적 입력 · 장학 내비</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="input">

  <!-- ===== 상단 바 ===== -->
  <header class="topbar">
    <div class="wrap">
      <a href="./index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B64DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M16 8l-2.5 5.5L8 16l2.5-5.5z"></path></svg>
        <span>장학 내비</span>
      </a>
    </div>
  </header>

  <!-- ===== 입력 폼 (가운데 560px) ===== -->
  <main class="input-main">
    <div class="input-head">
      <a href="./index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        처음으로
      </a>
      <h1>직전 학기 성적을<br>알려주세요</h1>
      <p>입력한 정보는 저장되지 않아요.</p>
    </div>

    <!-- novalidate: 브라우저 기본 검사 대신 app.js에서 직접 검사 -->
    <form id="grade-form" class="input-main-form" novalidate>
      <div class="fields">

        <!-- 1. 학년 (필수) -->
        <div class="field">
          <label for="grade">학년</label>
          <select id="grade">
            <option value="" disabled selected>선택해 주세요</option>
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
            <option value="4">4학년</option>
          </select>
          <p class="error-msg" hidden></p>
        </div>

        <!-- 2. 첫 학기 체크: 1학년일 때만 사용 가능. 체크하면 성적 칸이 모두 꺼짐 -->
        <div class="first-term">
          <label class="check-row" for="first-term">
            <input type="checkbox" id="first-term">
            첫 학기라 성적 없음 <span class="label-sub">(1학년 1학기)</span>
          </label>
          <p class="help">체크하면 성적 조건은 장학금에 따라 "통과" 또는 "확인 필요"로 안내해요.</p>
        </div>

        <!-- 3. 직전 학기 평점 (필수) -->
        <div class="field">
          <label for="gpa">직전 학기 평점 평균</label>
          <div class="input-box">
            <input id="gpa" type="text" inputmode="decimal" placeholder="예: 3.80" autocomplete="off">
            <span class="unit">/ 4.5</span>
          </div>
          <p class="error-msg" hidden></p>
        </div>

        <!-- 4. 누적 평점 (선택) -->
        <div class="field">
          <label for="cumGpa">누적 평점 <span class="label-sub">(4.5 만점 · 선택)</span></label>
          <div class="input-box">
            <input id="cumGpa" type="text" inputmode="decimal" placeholder="예: 3.65" autocomplete="off">
            <span class="unit">/ 4.5</span>
          </div>
          <p class="error-msg" hidden></p>
          <p class="help">모르면 비워두세요.</p>
        </div>

        <!-- 5. 백분율 점수 (선택) -->
        <div class="field">
          <label for="pct">백분율 점수 <span class="label-sub">(100점 만점 · 선택)</span></label>
          <div class="input-box">
            <input id="pct" type="text" inputmode="decimal" placeholder="예: 92.5" autocomplete="off">
            <span class="unit">/ 100</span>
          </div>
          <p class="error-msg" hidden></p>
          <p class="help">포털 성적표의 백분율 점수. 모르면 비워두세요.</p>
        </div>

        <!-- 6. 직전 학기 이수학점 (필수) -->
        <div class="field">
          <label for="credits">직전 학기 이수학점</label>
          <div class="input-box">
            <input id="credits" type="text" inputmode="numeric" placeholder="예: 18" autocomplete="off">
            <span class="unit">학점</span>
          </div>
          <p class="error-msg" hidden></p>
        </div>

        <!-- 7. 학자금 지원구간 (값: 기초·차상위=0, 1~10구간=1~10, 모름=unknown) -->
        <div class="field">
          <label for="income">학자금 지원구간 <span class="label-sub">(국가장학금 확인용)</span></label>
          <select id="income">
            <option value="" disabled selected>선택해 주세요</option>
            <option value="0">기초·차상위 (0구간)</option>
            <option value="1">1구간</option>
            <option value="2">2구간</option>
            <option value="3">3구간</option>
            <option value="4">4구간</option>
            <option value="5">5구간</option>
            <option value="6">6구간</option>
            <option value="7">7구간</option>
            <option value="8">8구간</option>
            <option value="9">9구간</option>
            <option value="10">10구간</option>
            <option value="unknown">모름</option>
          </select>
          <p class="error-msg" hidden></p>
          <p class="help">학자금 지원구간은 한국장학재단 홈페이지에서 확인할 수 있어요. 모르면 "모름"을 골라 주세요.</p>
        </div>

      </div>

      <!-- 필요한 칸이 모두 올바르면 활성화됨 -->
      <button type="submit" id="submit-btn" class="btn-primary btn-block" disabled>결과 보기</button>
    </form>
  </main>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
