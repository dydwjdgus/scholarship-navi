<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장학금 확인 결과 · 장학 내비</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="result" class="page-gray">

  <!-- ===== 상단 바 ===== -->
  <header class="topbar">
    <div class="wrap">
      <a href="./index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B64DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M16 8l-2.5 5.5L8 16l2.5-5.5z"></path></svg>
        <span>장학 내비</span>
      </a>
      <!-- href는 app.js가 입력값을 붙여서 바꿔줌 -->
      <a href="./input.html" id="retry-btn" class="btn-sub">다시 입력하기</a>
    </div>
  </header>

  <!-- ===== 결과 (가운데 720px) ===== -->
  <main class="result-main">

    <!-- 요약 카드: 제목·칩·개수는 app.js가 채움 -->
    <section class="white-card summary">
      <h1 id="summary-title">결과를 계산하고 있어요</h1>
      <div id="summary-chips" class="chips"></div>
      <div class="count-boxes">
        <div class="count-box pass">
          <span class="label">기준 충족</span>
          <span class="num" id="count-pass">0개</span>
        </div>
        <div class="count-box near">
          <span class="label">조금 부족</span>
          <span class="num" id="count-near">0개</span>
        </div>
        <div class="count-box none">
          <span class="label">해당 없음</span>
          <span class="num" id="count-none">0개</span>
        </div>
      </div>
    </section>

    <!-- 묶음 1: 기준 충족 -->
    <section class="result-group">
      <h2 class="section-title">기준을 충족했어요</h2>
      <div id="pass-list" class="result-list"></div>
    </section>

    <!-- 묶음 2: 조금 부족 / 확인 필요 -->
    <section class="result-group">
      <h2 class="section-title">조금만 더 하면 받을 수 있어요</h2>
      <div id="near-list" class="result-list"></div>
    </section>

    <!-- 묶음 3: 해당 없음 -->
    <section class="result-group">
      <h2 class="section-title">이번엔 해당되지 않아요</h2>
      <div id="none-list" class="result-list"></div>
    </section>

    <p class="notice">결과는 참고용이에요. 정확한 기준은 학교 및 한국장학재단 공지를 확인해 주세요.</p>
  </main>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
